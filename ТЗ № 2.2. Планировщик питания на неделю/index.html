<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Планировщик питания на неделю</title>
</head>
<body>

<h1>Планировщик питания на неделю</h1>

<p>
  Блюд: <span id="statDishes">0</span> |
  В меню: <span id="statMeals">0</span> |
  Покупок: <span id="statItems">0</span>
</p>

<hr>

<h2>Каталог блюд</h2>

<form id="dishForm">
  <p>
    <label for="dishName">Название</label><br>
    <input type="text" id="dishName" maxlength="60" placeholder="Овсяная каша" required>
  </p>
  <p>
    <label for="dishType">Тип</label><br>
    <select id="dishType">
      <option value="breakfast">Завтрак</option>
      <option value="lunch">Обед</option>
      <option value="dinner">Ужин</option>
    </select>
  </p>
  <p>
    <label for="dishIngredients">Ингредиенты</label><br>
    <input type="text" id="dishIngredients" maxlength="300" placeholder="овсянка, молоко, банан">
  </p>
  <p id="formHint" hidden></p>
  <p>
    <button type="submit" id="submitBtn">Добавить</button>
    <button type="button" id="cancelBtn" hidden>Отмена</button>
  </p>
</form>

<div id="dishList"></div>

<hr>

<h2>Меню на неделю</h2>
<p>
  <button type="button" id="randomBtn">Случайное меню</button>
  <button type="button" id="clearBtn">Очистить</button>
</p>
<p id="message" hidden></p>

<div id="menuGrid"></div>

<hr>

<h2>Список покупок (<span id="shoppingCount">0</span>)</h2>
<ul id="shoppingList"></ul>

<hr>

<div id="modal" hidden>
  <h3 id="modalTitle"></h3>
  <p id="modalText"></p>
  <p>
    <button type="button" id="modalCancel">Отмена</button>
    <button type="button" id="modalConfirm">Удалить</button>
  </p>
</div>

<script src="script.js"></script>
</body>
</html>
